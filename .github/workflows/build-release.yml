name: Build Release

on:
  push:
    tags:
      - 'v*'  # Trigger on any tag starting with 'v' (e.g., v2.1.0)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full git history for version detection
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Create virtual environment
      run: python -m venv .venv
    
    - name: Install dependencies
      run: |
        .venv\Scripts\python.exe -m pip install --upgrade pip
        .venv\Scripts\python.exe -m pip install -r requirements.txt
        .venv\Scripts\python.exe -m pip install -r requirements-dev.txt
    
    - name: Show version info
      run: |
        .venv\Scripts\python.exe version.py
    
    - name: Build executable
      run: |
        .venv\Scripts\python.exe build.py
    
    - name: Get version for release
      id: version
      run: |
        $VERSION = .venv\Scripts\python.exe -c "from version import __version__; print(__version__)"
        echo "version=$VERSION" >> $env:GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Create or Update Release + Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: bREadbeats ${{ steps.version.outputs.version }}
        body: |
          bREadbeats ${{ steps.version.outputs.version }}
          
          ## Changes
          - [Add release notes here]
          
          ## Download
          Download `bREadbeats.exe` below and run it directly - no installation required.
          
          See [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for usage instructions.
        draft: true
        prerelease: false
        files: |
          ./dist/bREadbeats.exe
        fail_on_unmatched_files: true